<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>相册排版工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#1c1f24;
    --paper:#f6f5f2;
    --panel:#ffffff;
    --line:#e2dfd8;
    --accent:#2f5d50;
    --accent-soft:#e4ece9;
    --danger:#a8432f;
    --muted:#8a8579;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  .app{display:flex;height:100vh;}
  /* ---------- 左侧栏 ---------- */
  .sidebar{width:280px;flex:0 0 280px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden;}
  .sidebar-section{padding:16px 18px;border-bottom:1px solid var(--line);}
  .sidebar-section h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
    margin:0 0 10px;font-weight:600;}
  .field-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .field-row label{font-size:12.5px;color:var(--ink);flex:1;}
  .field-row input{width:64px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;
    border:1px solid var(--line);border-radius:5px;padding:5px 6px;background:var(--paper);}
  .page-list{flex:1;overflow-y:auto;padding:8px 10px;}
  .page-item{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:8px;cursor:pointer;
    border:1px solid transparent;margin-bottom:4px;}
  .page-item:hover{background:var(--accent-soft);}
  .page-item.active{background:var(--accent-soft);border-color:var(--accent);}
  .page-item .idx{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);width:28px;}
  .page-item .meta{flex:1;font-size:12.5px;}
  .page-item .meta small{display:block;color:var(--muted);font-size:10.5px;margin-top:1px;}
  .icon-btn{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;
    padding:3px 5px;border-radius:4px;line-height:1;}
  .icon-btn:hover{background:#0000000d;color:var(--ink);}
  .add-page-box{padding:14px 16px;border-top:1px solid var(--line);background:#fbfaf8;}
  .count-grid{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
  .count-btn{width:34px;height:30px;border:1px solid var(--line);background:var(--panel);
    border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;cursor:pointer;}
  .count-btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:7px 12px;
    border-radius:6px;font-size:12.5px;cursor:pointer;font-weight:500;}
  .btn:hover{opacity:.9;}
  .btn.secondary{background:transparent;color:var(--accent);}
  .btn.small{padding:5px 9px;font-size:11.5px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .hint{font-size:11px;color:var(--muted);line-height:1.5;margin-top:6px;}
  /* ---------- 主区 ---------- */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .toolbar{padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .toolbar .group{display:flex;align-items:center;gap:6px;}
  .toolbar .sep{width:1px;height:22px;background:var(--line);}
  .toolbar select, .toolbar input[type=number]{border:1px solid var(--line);border-radius:5px;
    padding:5px 7px;font-size:12.5px;font-family:'IBM Plex Mono',monospace;background:var(--paper);}
  .switch{display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer;user-select:none;}
  .switch input{accent-color:var(--accent);}
  .canvas-wrap{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:30px;}
  .page-frame{background:#fff;box-shadow:0 4px 24px #0000001a;position:relative;}
  .split{display:flex;width:100%;height:100%;position:relative;}
  .split.row{flex-direction:column;}
  .split.col{flex-direction:row;}
  .split > .child{position:relative;overflow:hidden;}
  .divider{position:absolute;z-index:5;background:transparent;touch-action:none;}
  .divider.col{top:0;bottom:0;width:10px;margin-left:-5px;cursor:col-resize;}
  .divider.row{left:0;right:0;height:10px;margin-top:-5px;cursor:row-resize;}
  .divider:hover::after,.divider.dragging::after{content:'';position:absolute;background:var(--accent);opacity:.55;}
  .divider.col:hover::after,.divider.col.dragging::after{left:4px;right:4px;top:0;bottom:0;}
  .divider.row:hover::after,.divider.row.dragging::after{top:4px;bottom:4px;left:0;right:0;}
  .cell{width:100%;height:100%;position:relative;background:#eeece7;}
  .cell-inner{width:100%;height:100%;position:relative;overflow:hidden;background:#eeece7;
    display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .cell-inner img{position:absolute;display:block;max-width:none;max-height:none;user-select:none;-webkit-user-drag:none;}
  .cell-inner.has-image{cursor:grab;touch-action:none;}
  .cell-inner.has-image:active{cursor:grabbing;}
  .cell-inner .empty-mark{font-size:11px;color:#b9b3a4;font-family:'IBM Plex Mono',monospace;text-align:center;}
  .cell-inner.drop-target{outline:3px solid var(--accent);outline-offset:-3px;background:var(--accent-soft);}
  .drag-ghost{position:fixed;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:8px;overflow:hidden;
    pointer-events:none;z-index:200;box-shadow:0 6px 18px #00000055;border:2px solid #fff;opacity:.92;}
  .drag-ghost img{width:100%;height:100%;object-fit:cover;display:block;}
  .cell-clear,.cell-replace{position:absolute;top:4px;background:#00000099;color:#fff;border:none;
    width:18px;height:18px;border-radius:50%;font-size:11px;cursor:pointer;display:none;line-height:1;z-index:3;}
  .cell-clear{right:4px;}
  .cell-replace{right:26px;font-size:10px;}
  .cell-inner:hover .cell-clear,.cell-inner:hover .cell-replace{display:block;}
  .zoom-bar{position:absolute;left:4px;right:4px;bottom:4px;display:none;align-items:center;gap:5px;
    background:#00000066;border-radius:14px;padding:3px 8px;z-index:4;}
  .cell-inner:hover .zoom-bar{display:flex;}
  .zoom-bar input[type=range]{flex:1;accent-color:#fff;height:12px;}
  .zoom-bar button{background:transparent;border:none;color:#fff;cursor:pointer;font-size:12px;padding:0 2px;line-height:1;}
  .no-page{margin:auto;color:var(--muted);font-size:13px;text-align:center;max-width:280px;line-height:1.7;}
  /* 缩略图 mini 预览 */
  .mini-tree{width:64px;height:64px;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:0 0 auto;}
  .variant-list{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto;}
  .variant-item{display:flex;align-items:center;gap:10px;padding:6px;border:1px solid var(--line);
    border-radius:8px;cursor:pointer;}
  .variant-item:hover{border-color:var(--accent);background:var(--accent-soft);}
  .variant-item .vname{font-size:12.5px;}
  .modal-mask{position:fixed;inset:0;background:#00000055;display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:#fff;border-radius:12px;padding:20px;width:320px;max-height:80vh;display:flex;flex-direction:column;gap:12px;}
  .modal h3{margin:0;font-size:14px;}
  .modal-close{align-self:flex-end;}
  .progress-mask{position:fixed;inset:0;background:#ffffffd0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;z-index:100;font-size:13px;color:var(--ink);}
  .progress-bar{width:240px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;}
  .progress-bar > div{height:100%;background:var(--accent);width:0%;transition:width .15s;}
  .overview-mask{position:fixed;inset:0;background:var(--paper);z-index:60;display:flex;flex-direction:column;}
  .overview-head{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;
    justify-content:space-between;background:var(--panel);}
  .overview-head h3{margin:0;font-size:14px;}
  .overview-grid{flex:1;overflow-y:auto;padding:22px;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 16px;align-content:start;}
  .overview-item{cursor:pointer;}
  .overview-item .frame{background:#fff;box-shadow:0 2px 10px #00000022;position:relative;
    outline:2px solid transparent;}
  .overview-item:hover .frame{outline-color:var(--accent);}
  .overview-item .label{text-align:center;font-size:10.5px;color:var(--muted);margin-top:5px;
    font-family:'IBM Plex Mono',monospace;}
  /* 批量导入 */
  .batch-modal{width:min(640px,92vw);max-height:88vh;}
  .batch-thumbs{display:flex;flex-wrap:wrap;gap:6px;overflow-y:auto;max-height:38vh;padding:6px 2px;align-items:stretch;}
  .batch-thumb{position:relative;width:68px;height:68px;border-radius:6px;overflow:hidden;background:#eee;flex:0 0 auto;}
  .batch-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .bt-num{position:absolute;top:2px;left:2px;background:#00000099;color:#fff;font-size:9px;padding:1px 4px;
    border-radius:8px;font-family:'IBM Plex Mono',monospace;}
  .bt-rm{position:absolute;top:2px;right:2px;background:#00000099;color:#fff;border:none;width:17px;height:17px;
    border-radius:50%;font-size:9px;cursor:pointer;line-height:1;}
  .bt-moverow{position:absolute;bottom:2px;left:2px;right:2px;display:flex;justify-content:space-between;}
  .bt-moverow button{background:#00000099;color:#fff;border:none;width:19px;height:19px;border-radius:50%;
    font-size:10px;cursor:pointer;line-height:1;padding:0;}
  .bt-moverow button:disabled{opacity:.3;}
  .bt-break{width:12px;align-self:stretch;flex:0 0 auto;border-radius:4px;cursor:pointer;background:#0000000f;}
  .bt-break.active{background:var(--accent);}
  /* ---------- 移动端 ---------- */
  .mobile-topbar{display:none;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);
    border-bottom:1px solid var(--line);flex:0 0 auto;}
  .mobile-topbar button{background:transparent;border:none;font-size:20px;cursor:pointer;color:var(--ink);
    padding:2px 4px;line-height:1;}
  .mobile-topbar .mt-title{font-size:13px;font-weight:600;flex:1;}
  .sidebar-close{display:none;}
  .sidebar-backdrop{position:fixed;inset:0;background:#00000055;z-index:39;}
  @media (max-width:860px){
    .mobile-topbar{display:flex;}
    .app{position:relative;}
    .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:40;width:82vw;max-width:320px;flex-basis:auto;
      transform:translateX(-100%);transition:transform .22s ease;}
    .sidebar.open{transform:translateX(0);}
    .sidebar-close{display:block;position:absolute;top:10px;right:10px;background:transparent;border:none;
      font-size:18px;cursor:pointer;color:var(--muted);z-index:2;}
    .toolbar{padding:8px 10px;gap:10px;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;}
    .toolbar .btn.small,.toolbar .btn.secondary.small{white-space:nowrap;}
    .canvas-wrap{padding:12px;}
    .divider.col{width:26px;margin-left:-13px;}
    .divider.row{height:26px;margin-top:-13px;}
    .cell-clear,.cell-replace{width:26px;height:26px;font-size:13px;}
    .cell-replace{right:32px;}
    .zoom-bar{padding:6px 10px;bottom:6px;left:6px;right:6px;}
    .modal{width:92vw;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar-backdrop" id="sidebarBackdrop" style="display:none;"></div>

  <!-- 左侧栏 -->
  <div class="sidebar" id="sidebar">
    <button class="sidebar-close" id="sidebarCloseBtn">✕</button>
    <div class="sidebar-section">
      <h2>画册设置</h2>
      <div class="field-row"><label>页面宽 (mm)</label><input id="bookW" type="number" min="10" value="210"></div>
      <div class="field-row"><label>页面高 (mm)</label><input id="bookH" type="number" min="10" value="210"></div>
      <div class="field-row"><label>导出 DPI</label><input id="bookDpi" type="number" min="72" value="300"></div>
      <div class="hint">修改后立即对新旧页面生效,导出时按此尺寸/精度渲染。</div>
    </div>
    <div class="sidebar-section" style="padding-top:10px;padding-bottom:10px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <span id="cacheStatus" class="hint" style="margin:0;">本地缓存:未保存</span>
        <button class="icon-btn" id="clearCacheBtn" title="清除本地缓存并重新开始">清空缓存</button>
      </div>
    </div>
    <div class="page-list" id="pageList"></div>
    <div class="add-page-box">
      <button class="btn small" id="batchImportBtn" style="width:100%;margin-bottom:12px;">📥 批量导入照片 → 自动分组</button>
      <h2 style="margin-bottom:6px;">添加单页</h2>
      <div class="hint">按常用张数快速添加(游记页任意数量都支持):</div>
      <div class="count-grid" id="quickCounts"></div>
      <div class="field-row" style="margin-top:6px;">
        <label>自定义张数</label><input id="customCount" type="number" min="1" value="5">
      </div>
      <button class="btn secondary small" id="addCustomBtn" style="width:100%;margin-bottom:8px;">生成该张数模板</button>
      <div class="hint">或直接指定行×列网格:</div>
      <div class="field-row">
        <input id="gridR" type="number" min="1" value="2" style="width:44px;"> ×
        <input id="gridC" type="number" min="1" value="3" style="width:44px;">
        <button class="btn secondary small" id="addGridBtn">添加</button>
      </div>
    </div>
  </div>

  <!-- 主区域 -->
  <div class="main">
    <div class="mobile-topbar">
      <button id="menuBtn" title="页面列表">☰</button>
      <span class="mt-title">相册排版工具</span>
      <button id="mobileOverviewBtn" title="画册总览">▦</button>
    </div>
    <div class="toolbar" id="toolbar">
      <div class="group">
        <button class="btn secondary small" id="changeTemplateBtn">更换模板</button>
      </div>
      <div class="sep"></div>
      <div class="group">
        <label class="switch"><input type="checkbox" id="spacingOn"> 照片间留白</label>
        <input type="number" id="spacingMM" min="0" step="0.5" value="3" style="width:56px;" title="间距(mm)">
        <span style="font-size:11.5px;color:var(--muted);">mm</span>
      </div>
      <div class="sep"></div>
      <div class="group">
        <button class="btn secondary small" id="dupPageBtn">复制此页</button>
        <button class="btn secondary small" id="delPageBtn">删除此页</button>
      </div>
      <div style="flex:1;"></div>
      <div class="group">
        <button class="btn secondary small" id="overviewBtn">画册总览</button>
        <button class="btn secondary small" id="exportPngBtn">导出本页 PNG</button>
        <button class="btn small" id="exportPdfBtn">导出全部为 PDF</button>
      </div>
    </div>
    <div class="canvas-wrap" id="canvasWrap">
      <div class="no-page" id="noPageMsg">还没有页面。<br>先在左下角选择每页照片数量,挑一个排版模板,开始搭建你的 138 页画册。</div>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none;">
<input type="file" id="batchFileInput" accept="image/*" multiple style="display:none;">

<script>
/* ====================== 数据模型 ====================== */
let book = { widthMM:210, heightMM:210, dpi:300 };
let pages = [];          // {id, count, tree, spacingOn, spacingMM, images:{leafId:{file,url}}}
let currentPageId = null;
let leafClickTarget = null;
let idSeq = 1;
const nextId = () => idSeq++;

/* ====================== 本地缓存 (IndexedDB) ====================== */
const DB_NAME = 'album-layout-tool-db';
let dbPromise = null;
function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if(!db.objectStoreNames.contains('project')) db.createObjectStore('project');
      if(!db.objectStoreNames.contains('images')) db.createObjectStore('images');
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
  return dbPromise;
}
async function idbPut(store, key, val){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).put(val, key);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
async function idbGet(store, key){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbDelete(store, key){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
async function idbClearAll(){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(['project','images'],'readwrite');
    tx.objectStore('project').clear();
    tx.objectStore('images').clear();
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
let saveTimer = null;
function scheduleSave(){
  clearTimeout(saveTimer);
  setCacheStatus('保存中…');
  saveTimer = setTimeout(saveProjectMeta, 400);
}
async function saveProjectMeta(){
  const meta = {
    book,
    idSeq,
    currentPageId,
    pages: pages.map(p=>({
      id:p.id, count:p.count, tree:p.tree, spacingOn:p.spacingOn, spacingMM:p.spacingMM,
      images: Object.fromEntries(Object.entries(p.images).map(([k,v])=>[k,{scale:v.scale,panFracX:v.panFracX,panFracY:v.panFracY}]))
    }))
  };
  try{
    await idbPut('project','main', meta);
    setCacheStatus('已自动保存 ' + new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'}));
  }catch(err){
    setCacheStatus('保存失败');
    console.error(err);
  }
}
function setCacheStatus(text){
  const el = document.getElementById('cacheStatus');
  if(el) el.textContent = '本地缓存:' + text;
}
async function restoreFromCache(){
  let meta;
  try{ meta = await idbGet('project','main'); }catch(err){ console.error(err); return false; }
  if(!meta || !meta.pages || !meta.pages.length) return false;
  const ok = confirm(`检测到本地保存的进度(共 ${meta.pages.length} 页),是否恢复?\n取消则从空白开始(不会删除已保存的缓存)。`);
  if(!ok) return false;
  book = meta.book || book;
  idSeq = meta.idSeq || idSeq;
  document.getElementById('bookW').value = book.widthMM;
  document.getElementById('bookH').value = book.heightMM;
  document.getElementById('bookDpi').value = book.dpi;
  pages = [];
  for(const pm of meta.pages){
    const page = { id:pm.id, count:pm.count, tree:pm.tree, spacingOn:pm.spacingOn, spacingMM:pm.spacingMM, images:{} };
    for(const leafKey in (pm.images||{})){
      try{
        const blob = await idbGet('images', pm.id+'__'+leafKey);
        if(blob){
          const meta = pm.images[leafKey] || {};
          page.images[leafKey] = { file:blob, url:URL.createObjectURL(blob), scale:meta.scale||1, panFracX:meta.panFracX||0, panFracY:meta.panFracY||0 };
        }
      }catch(err){ console.error(err); }
    }
    pages.push(page);
  }
  currentPageId = meta.currentPageId && pages.some(p=>p.id===meta.currentPageId) ? meta.currentPageId : (pages[0] ? pages[0].id : null);
  setCacheStatus('已恢复上次进度');
  return true;
}
document.getElementById('clearCacheBtn').onclick = async ()=>{
  if(!confirm('清空本地缓存不会影响当前页面上的内容,但下次打开将无法恢复。确定清空吗?')) return;
  await idbClearAll();
  setCacheStatus('已清空');
};

/* ---- split 树节点 ---- */
const leaf = () => ({ type:'leaf', id:null });
const split = (dir, ratio, a, b) => ({ type:'split', dir, ratio, a, b });

function splitEqual(nodes, dir){
  if(nodes.length === 1) return nodes[0];
  return split(dir, 1/nodes.length, nodes[0], splitEqual(nodes.slice(1), dir));
}
function equalGrid(rows, cols){
  const rowNodes = [];
  for(let r=0;r<rows;r++){
    const cells = []; for(let c=0;c<cols;c++) cells.push(leaf());
    rowNodes.push(splitEqual(cells,'col'));
  }
  return splitEqual(rowNodes,'row');
}
function autoGrid(n){
  const rows = Math.max(1, Math.round(Math.sqrt(n)));
  const base = Math.floor(n/rows), rem = n % rows;
  const rowNodes = [];
  for(let r=0;r<rows;r++){
    const count = base + (r < rem ? 1 : 0);
    if(count <= 0) continue;
    const cells=[]; for(let c=0;c<count;c++) cells.push(leaf());
    rowNodes.push(splitEqual(cells,'col'));
  }
  return splitEqual(rowNodes,'row');
}
function assignIds(tree){
  let count = 0;
  (function walk(node){
    if(node.type==='leaf'){ node.id = count++; }
    else { walk(node.a); walk(node.b); }
  })(tree);
  return count;
}
function cloneTree(node){
  if(node.type==='leaf') return { type:'leaf', id:node.id };
  return { type:'split', dir:node.dir, ratio:node.ratio, a:cloneTree(node.a), b:cloneTree(node.b) };
}

/* ====================== 页面 CRUD ====================== */
function addPage(count, treeTemplate){
  const tree = cloneTree(treeTemplate);
  assignIds(tree);
  const page = { id: nextId(), count, tree, spacingOn:false, spacingMM:3, images:{} };
  pages.push(page);
  selectPage(page.id);
  renderPageList();
  scheduleSave();
}
function selectPage(id){
  currentPageId = id;
  renderPageList();
  renderEditor();
  if(typeof closeSidebar === 'function') closeSidebar();
}
function currentPage(){ return pages.find(p=>p.id===currentPageId); }
function deletePage(id){
  const idx = pages.findIndex(p=>p.id===id);
  if(idx<0) return;
  const p = pages[idx];
  Object.keys(p.images).forEach(leafKey=>{ idbDelete('images', p.id+'__'+leafKey).catch(console.error); });
  pages.splice(idx,1);
  if(currentPageId===id) currentPageId = pages[idx] ? pages[idx].id : (pages[idx-1]?pages[idx-1].id:null);
  renderPageList(); renderEditor();
  scheduleSave();
}
function duplicatePage(id){
  const p = pages.find(x=>x.id===id);
  if(!p) return;
  const tree = cloneTree(p.tree);
  const np = { id: nextId(), count:p.count, tree, spacingOn:p.spacingOn, spacingMM:p.spacingMM, images:{} };
  const idx = pages.findIndex(x=>x.id===id);
  pages.splice(idx+1,0,np);
  selectPage(np.id);
  renderPageList();
  scheduleSave();
}
function movePage(id, dir){
  const idx = pages.findIndex(p=>p.id===id);
  const ni = idx+dir;
  if(ni<0||ni>=pages.length) return;
  [pages[idx],pages[ni]] = [pages[ni],pages[idx]];
  renderPageList();
  scheduleSave();
}

function renderPageList(){
  const wrap = document.getElementById('pageList');
  wrap.innerHTML = '';
  pages.forEach((p, i)=>{
    const filled = Object.keys(p.images).length;
    const el = document.createElement('div');
    el.className = 'page-item' + (p.id===currentPageId?' active':'');
    el.innerHTML = `
      <span class="idx">${String(i+1).padStart(3,'0')}</span>
      <span class="meta">${p.count} 张${p.spacingOn?' · 留白':''}<small>${filled}/${p.count} 已放照片</small></span>
      <button class="icon-btn" data-act="up" title="上移">↑</button>
      <button class="icon-btn" data-act="down" title="下移">↓</button>
      <button class="icon-btn" data-act="del" title="删除">✕</button>
    `;
    el.addEventListener('click', (e)=>{

function clamp(v,min,max){ return Math.min(max, Math.max(min, v)); }

/* 交换同一页内两个格子的照片(目标为空则等于移动过去) */
function swapPageImages(page, aId, bId){
  const a = page.images[aId], b = page.images[bId];
  if(a) page.images[bId] = a; else delete page.images[bId];
  if(b) page.images[aId] = b; else delete page.images[aId];
  const pid = page.id;
  (async ()=>{
    try{
      if(a) await idbPut('images', pid+'__'+bId, a.file); else await idbDelete('images', pid+'__'+bId);
      if(b) await idbPut('images', pid+'__'+aId, b.file); else await idbDelete('images', pid+'__'+aId);
    }catch(err){ console.error(err); }
  })();
  scheduleSave();
}

/* 计算"覆盖式"填充下,图片在容器中的显示尺寸与位置(支持额外缩放 scale 与拖拽偏移 panFrac) */
function coverGeom(containerW, containerH, mediaW, mediaH, userScale, panFracX, panFracY){
  const base = Math.max(containerW/mediaW, containerH/mediaH);
  const scale = base * (userScale || 1);
  const dw = mediaW*scale, dh = mediaH*scale;
  const slackX = dw-containerW, slackY = dh-containerH;
  const left = -(slackX/2) + (panFracX||0)*(slackX/2);
  const top = -(slackY/2) + (panFracY||0)*(slackY/2);
  return { scale, dw, dh, left, top, slackX, slackY };
}

function renderNode(node, page, interactive){
  if(node.type === 'leaf'){
    const cell = document.createElement('div');
    cell.className = 'cell';
    const gapPct = page.spacingOn ? (page.spacingMM / book.widthMM) * 100 : 0;
    const inner = document.createElement('div');
    inner.className = 'cell-inner';
    inner.style.margin = gapPct + '%';
    inner.style.width = `calc(100% - ${gapPct*2}%)`;
    inner.style.height = `calc(100% - ${gapPct*2}%)`;
    inner.dataset.leafId = node.id;
    const imgData = page.images[node.id];
    if(imgData){
      inner.classList.add('has-image');
      const im = document.createElement('img');
      im.src = imgData.url;
      inner.appendChild(im);

      const doLayout = ()=>{
        const cw = inner.clientWidth, ch = inner.clientHeight;
        const nw = im.naturalWidth, nh = im.naturalHeight;
        if(!cw||!ch||!nw||!nh) return;
        const g = coverGeom(cw,ch,nw,nh, imgData.scale, imgData.panFracX, imgData.panFracY);
        im.style.width = g.dw+'px'; im.style.height = g.dh+'px';
        im.style.left = g.left+'px'; im.style.top = g.top+'px';
      };
      if(im.complete && im.naturalWidth) requestAnimationFrame(doLayout);
      else im.onload = doLayout;

      if(interactive){
        // 拖拽平移(支持鼠标与触屏);拖出格子边界则改为拖动照片去交换位置
        inner.addEventListener('pointerdown', (e)=>{
          if(e.target.closest('.zoom-bar') || e.target.closest('.cell-clear') || e.target.closest('.cell-replace')) return;
          e.preventDefault();
          const cw = inner.clientWidth, ch = inner.clientHeight;
          const nw = im.naturalWidth, nh = im.naturalHeight;
          if(!nw||!nh) return;
          inner.setPointerCapture(e.pointerId);
          const startX = e.clientX, startY = e.clientY;
          const g0 = coverGeom(cw,ch,nw,nh, imgData.scale, imgData.panFracX, imgData.panFracY);
          const sourceRect = inner.getBoundingClientRect();
          let dragged = false, swapMode = false, ghost = null, currentTarget = null;

          function enterSwapMode(){
            swapMode = true;
            ghost = document.createElement('div');
            ghost.className = 'drag-ghost';
            const gimg = document.createElement('img');
            gimg.src = imgData.url;
            ghost.appendChild(gimg);
            document.body.appendChild(ghost);
          }
          function setHighlight(el){
            if(el && el !== inner){
              if(currentTarget && currentTarget !== el) currentTarget.classList.remove('drop-target');
              currentTarget = el; currentTarget.classList.add('drop-target');
            } else {
              if(currentTarget) currentTarget.classList.remove('drop-target');
              currentTarget = null;
            }
          }
          function onMove(ev){
            dragged = true;
            if(!swapMode){
              const margin = 6;
              const outside = ev.clientX < sourceRect.left-margin || ev.clientX > sourceRect.right+margin ||
                               ev.clientY < sourceRect.top-margin || ev.clientY > sourceRect.bottom+margin;
              if(outside){ enterSwapMode(); }
              else {
                const dx = ev.clientX-startX, dy = ev.clientY-startY;
                const newLeft = g0.left+dx, newTop = g0.top+dy;
                imgData.panFracX = g0.slackX!==0 ? clamp((newLeft+g0.slackX/2)/(g0.slackX/2), -1, 1) : 0;
                imgData.panFracY = g0.slackY!==0 ? clamp((newTop+g0.slackY/2)/(g0.slackY/2), -1, 1) : 0;
                doLayout();
                return;
              }
            }
            ghost.style.left = ev.clientX+'px'; ghost.style.top = ev.clientY+'px';
            const el = document.elementFromPoint(ev.clientX, ev.clientY);
            setHighlight(el && el.closest ? el.closest('.cell-inner') : null);
          }
          function onUp(ev){
            inner.removeEventListener('pointermove', onMove);
            inner.removeEventListener('pointerup', onUp);
            try{ inner.releasePointerCapture(ev.pointerId); }catch(err){}
            if(swapMode){
              if(currentTarget){
                const targetLeafId = parseInt(currentTarget.dataset.leafId, 10);
                if(!Number.isNaN(targetLeafId) && targetLeafId !== node.id) swapPageImages(page, node.id, targetLeafId);
                currentTarget.classList.remove('drop-target');
              }
              ghost.remove();
              renderEditor(); renderPageList();
            }
            if(dragged) scheduleSave();
          }
          inner.addEventListener('pointermove', onMove);
          inner.addEventListener('pointerup', onUp);
        });
        // 滚轮缩放
        let wheelSaveTimer = null;
        inner.addEventListener('wheel', (e)=>{
          e.preventDefault();
          imgData.scale = clamp((imgData.scale||1) + (e.deltaY<0?0.08:-0.08), 1, 4);
          doLayout();
          const slider = inner.querySelector('.zoom-slider');
          if(slider) slider.value = imgData.scale;
          clearTimeout(wheelSaveTimer); wheelSaveTimer = setTimeout(scheduleSave, 300);
        }, {passive:false});

        const replaceBtn = document.createElement('button');
        replaceBtn.className = 'cell-replace'; replaceBtn.textContent = '⟳'; replaceBtn.title='更换照片';
        replaceBtn.onclick = (e)=>{ e.stopPropagation(); leafClickTarget = {page, leafId:node.id}; document.getElementById('fileInput').click(); };
        inner.appendChild(replaceBtn);

        const clearBtn = document.createElement('button');
        clearBtn.className = 'cell-clear'; clearBtn.textContent='✕'; clearBtn.title='移除照片';
        clearBtn.onclick = (e)=>{ e.stopPropagation(); delete page.images[node.id]; idbDelete('images', page.id+'__'+node.id).catch(console.error); renderEditor(); renderPageList(); scheduleSave(); };
        inner.appendChild(clearBtn);

        const zoomBar = document.createElement('div');
        zoomBar.className = 'zoom-bar';
        const resetBtn = document.createElement('button');
        resetBtn.textContent = '⟲'; resetBtn.title = '重置缩放/位置';
        resetBtn.onclick = (e)=>{ e.stopPropagation(); imgData.scale=1; imgData.panFracX=0; imgData.panFracY=0; slider.value=1; doLayout(); scheduleSave(); };
        const slider = document.createElement('input');
        slider.type = 'range'; slider.className='zoom-slider';
        slider.min = 1; slider.max = 4; slider.step = 0.02; slider.value = imgData.scale || 1;
        slider.oninput = (e)=>{ imgData.scale = parseFloat(e.target.value); doLayout(); };
        slider.onchange = ()=>scheduleSave();
        slider.onmousedown = (e)=>e.stopPropagation();
        slider.onpointerdown = (e)=>e.stopPropagation();
        zoomBar.appendChild(resetBtn); zoomBar.appendChild(slider);
        inner.appendChild(zoomBar);
      }
    } else {
      const mark = document.createElement('span');
      mark.className = 'empty-mark'; mark.textContent = '点击上传\n#'+(node.id+1);
      mark.style.whiteSpace='pre-line';
      inner.appendChild(mark);
      if(interactive){
        inner.onclick = ()=>{ leafClickTarget = {page, leafId:node.id}; document.getElementById('fileInput').click(); };
      }
    }
    cell.appendChild(inner);
    return cell;
  }
  const box = document.createElement('div');
  box.className = 'split ' + node.dir;
  const aWrap = document.createElement('div');
  aWrap.className = 'child';
  aWrap.style.flex = node.ratio;
  aWrap.appendChild(renderNode(node.a, page, interactive));
  const bWrap = document.createElement('div');
  bWrap.className = 'child';
  bWrap.style.flex = (1-node.ratio);
  bWrap.appendChild(renderNode(node.b, page, interactive));
  box.appendChild(aWrap);
  if(interactive){
    const divider = document.createElement('div');
    divider.className = 'divider ' + node.dir;
    attachDrag(divider, node, box, aWrap, bWrap);
    box.appendChild(divider);
    requestAnimationFrame(()=>positionDivider(box, divider, node));
  }
  box.appendChild(bWrap);
  return box;
}
function positionDivider(box, divider, node){
  if(node.dir==='col'){ divider.style.left = (node.ratio*100)+'%'; }
  else { divider.style.top = (node.ratio*100)+'%'; }
}
function attachDrag(divider, node, box, aWrap, bWrap){
  divider.addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    divider.setPointerCapture(e.pointerId);
    divider.classList.add('dragging');
    const rect = box.getBoundingClientRect();
    function onMove(ev){
      let ratio;
      if(node.dir==='col') ratio = (ev.clientX - rect.left)/rect.width;
      else ratio = (ev.clientY - rect.top)/rect.height;
      ratio = Math.min(0.92, Math.max(0.08, ratio));
      node.ratio = ratio;
      aWrap.style.flex = ratio; bWrap.style.flex = (1-ratio);
      positionDivider(box, divider, node);
    }
    function onUp(ev){
      divider.classList.remove('dragging');
      divider.removeEventListener('pointermove', onMove);
      divider.removeEventListener('pointerup', onUp);
      try{ divider.releasePointerCapture(ev.pointerId); }catch(err){}
      scheduleSave();
    }
    divider.addEventListener('pointermove', onMove);
    divider.addEventListener('pointerup', onUp);
  });
}

/* ====================== 导出:计算矩形 ====================== */
function computeRects(node, x, y, w, h, out){
  if(node.type==='leaf'){ out[node.id] = {x,y,w,h}; return; }
  if(node.dir==='col'){
    const wa = w*node.ratio;
    computeRects(node.a, x, y, wa, h, out);
    computeRects(node.b, x+wa, y, w-wa, h, out);
  } else {
    const ha = h*node.ratio;
    computeRects(node.a, x, y, w, ha, out);
    computeRects(node.b, x, y+ha, w, h-ha, out);
  }
}
/* 用 <img> 解码而非 createImageBitmap:iOS Safari 对某些照片(如 iPhone 拍摄的
   HEIC 格式)用 createImageBitmap 读取会失败,但 <img> 标签能正常显示,导出时走同一条路径更可靠 */
function loadImageElement(url){
  return new Promise((resolve, reject)=>{
    const el = new Image();
    el.onload = ()=>resolve(el);
    el.onerror = ()=>reject(new Error('图片解码失败'));
    el.src = url;
  });
}
async function renderPageToCanvas(page, wPx, hPx, pxPerMM){
  const canvas = document.createElement('canvas');
  canvas.width = wPx; canvas.height = hPx;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,wPx,hPx);
  const rects = {};
  computeRects(page.tree, 0, 0, wPx, hPx, rects);
  const gapPx = page.spacingOn ? page.spacingMM*pxPerMM : 0;
  for(const leafId in rects){
    const r = rects[leafId];
    const rx = r.x+gapPx/2, ry = r.y+gapPx/2, rw = Math.max(1,r.w-gapPx), rh = Math.max(1,r.h-gapPx);
    const img = page.images[leafId];
    if(img){
      const el = await loadImageElement(img.url);
      const g = coverGeom(rw, rh, el.naturalWidth, el.naturalHeight, img.scale, img.panFracX, img.panFracY);
      const sx = -g.left/g.scale, sy = -g.top/g.scale, sw = rw/g.scale, sh = rh/g.scale;
      ctx.drawImage(el, sx, sy, sw, sh, rx, ry, rw, rh);
    } else {
      ctx.fillStyle = '#e4e1d9';
      ctx.fillRect(rx,ry,rw,rh);
    }
  }
  return canvas;
}

/* ====================== 导出按钮 ====================== */
document.getElementById('exportPngBtn').onclick = async ()=>{
  const page = currentPage(); if(!page) return;
  try{
    const pxPerMM = book.dpi/25.4;
    const wPx = Math.round(book.widthMM*pxPerMM), hPx = Math.round(book.heightMM*pxPerMM);
    const canvas = await renderPageToCanvas(page, wPx, hPx, pxPerMM);
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = `page-${pages.indexOf(page)+1}.png`;
    a.click();
  } catch(err){
    alert('导出失败: ' + err.message);
    console.error(err);
  }
};

function showProgress(){
  const mask = document.createElement('div');
  mask.className = 'progress-mask'; mask.id='progressMask';
  mask.innerHTML = `<div id="progressText">正在导出第 0 / 0 页…</div><div class="progress-bar"><div id="progressFill"></div></div>`;
  document.body.appendChild(mask);
}
function updateProgress(i, total){
  const text = document.getElementById('progressText');
  const fill = document.getElementById('progressFill');
  if(text) text.textContent = `正在导出第 ${i} / ${total} 页…`;
  if(fill) fill.style.width = (i/total*100)+'%';
}
function hideProgress(){
  const mask = document.getElementById('progressMask');
  if(mask) document.body.removeChild(mask);
}

document.getElementById('exportPdfBtn').onclick = async ()=>{
  if(!pages.length){ alert('还没有页面可导出。'); return; }
  showProgress();
  await new Promise(r=>setTimeout(r,30)); // 让遮罩先绘制出来
  try{
    const { jsPDF } = window.jspdf;
    const pxPerMM = book.dpi/25.4;
    const wPx = Math.round(book.widthMM*pxPerMM), hPx = Math.round(book.heightMM*pxPerMM);
    const orientation = book.widthMM >= book.heightMM ? 'l' : 'p';
    const pdf = new jsPDF({ orientation, unit:'mm', format:[book.widthMM, book.heightMM] });
    for(let i=0;i<pages.length;i++){
      updateProgress(i+1, pages.length);
      await new Promise(r=>setTimeout(r,0));
      const canvas = await renderPageToCanvas(pages[i], wPx, hPx, pxPerMM);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
      if(i>0) pdf.addPage([book.widthMM, book.heightMM], orientation);
      pdf.addImage(dataUrl, 'JPEG', 0, 0, book.widthMM, book.heightMM);
    }
    pdf.save('相册.pdf');
  } catch(err){
    alert('导出失败: ' + err.message);
    console.error(err);
  } finally {
    hideProgress();
  }
};

/* ====================== 画册总览 ====================== */
function openOverview(){
  if(!pages.length){ alert('还没有页面。'); return; }
  const mask = document.createElement('div');
  mask.className = 'overview-mask';
  const head = document.createElement('div');
  head.className = 'overview-head';
  head.innerHTML = `<h3>画册总览 · 共 ${pages.length} 页</h3>`;
  const closeBtn = document.createElement('button');
  closeBtn.className = 'btn secondary small'; closeBtn.textContent = '关闭';
  closeBtn.onclick = ()=>document.body.removeChild(mask);
  head.appendChild(closeBtn);
  const grid = document.createElement('div');
  grid.className = 'overview-grid';
  const ratio = book.widthMM / book.heightMM;
  pages.forEach((p,i)=>{
    const item = document.createElement('div');
    item.className = 'overview-item';
    const frame = document.createElement('div');
    frame.className = 'frame';
    frame.style.width = '100%';
    frame.style.aspectRatio = ratio;
    frame.appendChild(renderNode(p.tree, p, false));
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = `第 ${i+1} 页 · ${p.count} 张`;
    item.appendChild(frame); item.appendChild(label);
    item.onclick = ()=>{ document.body.removeChild(mask); selectPage(p.id); };
    grid.appendChild(item);
  });
  mask.appendChild(head); mask.appendChild(grid);
  document.body.appendChild(mask);
}
document.getElementById('overviewBtn').onclick = openOverview;
document.getElementById('mobileOverviewBtn').onclick = openOverview;

/* ====================== 移动端侧栏 ====================== */
const sidebarEl = document.getElementById('sidebar');
const backdropEl = document.getElementById('sidebarBackdrop');

function closeSidebar(){ sidebarEl.classList.remove('open'); backdropEl.style.display='none'; }

/* ====================== 批量导入照片(自动分组) ====================== */
let batchFiles = [];
let batchBreaks = new Set(); // 存"在第 i 张之后切一刀"的下标
document.getElementById('batchFileInput').addEventListener('change', (e)=>{
  batchFiles = batchFiles.concat(Array.from(e.target.files));
  e.target.value = '';
  renderBatchThumbs();
});
function computeGroups(){
  const groups = []; let cur = [];
  batchFiles.forEach((f,i)=>{
    cur.push(f);
    if(batchBreaks.has(i) || i===batchFiles.length-1){ groups.push(cur); cur=[]; }
  });
  return groups;
}
function renderBatchThumbs(){
  const wrap = document.getElementById('batchThumbs');
  if(!wrap) return;
  wrap.innerHTML = '';
  batchFiles.forEach((file,i)=>{
    const t = document.createElement('div'); t.className='batch-thumb';
    const img = document.createElement('img'); img.src = URL.createObjectURL(file);
    const num = document.createElement('span'); num.className='bt-num'; num.textContent = i+1;
    const rm = document.createElement('button'); rm.className='bt-rm'; rm.textContent='✕'; rm.title='移除';
    rm.onclick = ()=>{
      const nb = new Set();
      batchBreaks.forEach(b=>{ if(b<i) nb.add(b); else if(b>i) nb.add(b-1); });
      batchBreaks = nb;
      batchFiles.splice(i,1);
      renderBatchThumbs();
    };
    const moveRow = document.createElement('div'); moveRow.className='bt-moverow';
    const left = document.createElement('button'); left.textContent='◀'; left.disabled=(i===0);
    left.onclick = ()=>{ [batchFiles[i-1],batchFiles[i]]=[batchFiles[i],batchFiles[i-1]]; renderBatchThumbs(); };
    const right = document.createElement('button'); right.textContent='▶'; right.disabled=(i===batchFiles.length-1);
    right.onclick = ()=>{ [batchFiles[i+1],batchFiles[i]]=[batchFiles[i],batchFiles[i+1]]; renderBatchThumbs(); };
    moveRow.appendChild(left); moveRow.appendChild(right);
    t.appendChild(num); t.appendChild(img); t.appendChild(rm); t.appendChild(moveRow);
    wrap.appendChild(t);
    if(i < batchFiles.length-1){
      const brk = document.createElement('div');
      brk.className = 'bt-break' + (batchBreaks.has(i)?' active':'');
      brk.title = '点击切换分页点';
      brk.onclick = ()=>{ if(batchBreaks.has(i)) batchBreaks.delete(i); else batchBreaks.add(i); renderBatchThumbs(); };
      wrap.appendChild(brk);
    }
  });
  const groups = computeGroups();
  const summary = document.getElementById('batchSummary');
  if(summary){
    summary.textContent = batchFiles.length
      ? `共 ${batchFiles.length} 张 → 将生成 ${groups.length} 页 (${groups.map(g=>g.length).join('+')})`
      : '还没有选择照片';
  }
}
function openBatchImport(){
  batchFiles = []; batchBreaks = new Set();
  const mask = document.createElement('div'); mask.className = 'modal-mask';
  const modal = document.createElement('div'); modal.className = 'modal batch-modal';
  modal.innerHTML = `
    <h3>批量导入照片 · 自动分组</h3>
    <button class="btn secondary small" id="batchPickBtn" style="align-self:flex-start;">选择照片(可多选,可分次选)</button>
    <div class="field-row" style="margin-top:2px;">
      <label>每组张数</label><input id="batchGroupSize" type="number" min="1" value="4" style="width:60px;">
      <button class="btn secondary small" id="autoGroupBtn">按此张数自动分组</button>
    </div>
    <div class="hint">◀▶ 调整叙事顺序;点击两张照片之间的细条,切/取消一个分页点;✕ 移除误选的照片。</div>
    <div id="batchSummary" class="hint" style="font-weight:600;color:var(--ink);">还没有选择照片</div>
    <div id="batchThumbs" class="batch-thumbs"></div>
  `;
  const btnRow = document.createElement('div'); btnRow.style.cssText='display:flex;gap:8px;justify-content:flex-end;';
  const cancelBtn = document.createElement('button'); cancelBtn.className='btn secondary small'; cancelBtn.textContent='取消';
  cancelBtn.onclick = ()=>document.body.removeChild(mask);
  const confirmBtn = document.createElement('button'); confirmBtn.className='btn small'; confirmBtn.textContent='生成页面';
  confirmBtn.onclick = ()=>{
    const groups = computeGroups();
    if(!groups.length){ alert('请先选择照片。'); return; }
    let firstId = null;
    groups.forEach(files=>{
      const n = files.length;
      const tree = cloneTree(variantsFor(n)[0].tree);
      assignIds(tree);
      const page = { id: nextId(), count:n, tree, spacingOn:false, spacingMM:3, images:{} };
      files.forEach((file, idx)=>{
        const url = URL.createObjectURL(file);
        page.images[idx] = { file, url, scale:1, panFracX:0, panFracY:0 };
        idbPut('images', page.id+'__'+idx, file).catch(console.error);
      });
      pages.push(page);
      if(firstId===null) firstId = page.id;
    });
    document.body.removeChild(mask);
    batchFiles = []; batchBreaks = new Set();
    renderPageList();
    if(firstId) selectPage(firstId);
    scheduleSave();
  };
  btnRow.appendChild(cancelBtn); btnRow.appendChild(confirmBtn);
  modal.appendChild(btnRow);
  mask.appendChild(modal);
  mask.addEventListener('click',(e)=>{ if(e.target===mask) document.body.removeChild(mask); });
  document.body.appendChild(mask);
  document.getElementById('batchPickBtn').onclick = ()=>document.getElementById('batchFileInput').click();
  document.getElementById('autoGroupBtn').onclick = ()=>{
    const n = parseInt(document.getElementById('batchGroupSize').value,10) || 4;
    batchBreaks = new Set();
    for(let i=n-1;i<batchFiles.length-1;i+=n) batchBreaks.add(i);
    renderBatchThumbs();
  };
}
document.getElementById('batchImportBtn').onclick = openBatchImport;

  await restoreFromCache();
  renderPageList();
  renderEditor();

window.addEventListener('beforeunload', (e)=>{
  if(pages.length){ e.preventDefault(); e.returnValue=''; }
